app = "hoopbrain-proxy"
primary_region = "ams"

kill_signal = "SIGINT"
kill_timeout = "5s"

[env]
NODE_ENV = "production"
PORT = "8080"

# ==========================================
# HTTP SERVICE (LOAD BALANCER)
# ==========================================
[http_service]
internal_port = 8080
force_https = true

# Ücretsiz Fly.io Tier için optimize edilmiş autoscaling
auto_start_machines = true
auto_stop_machines = true

# Tek makine sürekli açık (ANA)
min_machines_running = 1

# Yük bindiğinde ikinci makine açılır (YARDIMCI)
max_machines_running = 2

processes = ["app"]

# ==========================================
# MACHINE TYPE (FREE TIER UYUMLU)
# ==========================================
[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "512mb"

# ==========================================
# SERVICE PORTS + CONCURRENCY
# ==========================================
[[services]]
internal_port = 8080
protocol = "tcp"

  [[services.ports]]
  port = 80

  [[services.ports]]
  port = 443

  [[services.concurrency]]
  type = "requests"
  soft_limit = 60
  hard_limit = 120

# ==========================================
# DEPLOY STRATEGY
# ==========================================
[deploy]
strategy = "rolling"

# ==========================================
# EXPERIMENTAL
# ==========================================
[experimental]
allowed_public_ports = []
auto_rollback = true

