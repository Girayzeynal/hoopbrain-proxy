app = "hoopbrain-proxy"
primary_region = "ams"

# UYKU MODU KAPALI
kill_signal = "SIGINT"
kill_timeout = "5s"

[env]
  NODE_ENV = "production"
  PORT = "8080"

# ==========================================
# HTTP SERVICE (24/7 AÇIK – STABLE)
# ==========================================
[http_service]
  internal_port = 8080
  force_https = true

  # AUTO SCALE
  auto_start_machines = true
  auto_stop_machines = false    # uyku modu kapalı

  # Yalnızca 1 makine çalışacak — stabil
  min_machines_running = 1
  max_machines_running = 1

  processes = ["app"]

# ==========================================
# MACHINE TYPE (FREE TIER UYUMLU)
# ==========================================
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

# ==========================================
# DEPLOY STRATEGY
# ==========================================
[deploy]
  strategy = "immediate"   # rolling değil, hızlı deploy

# ==========================================
# EXPERIMENTAL
# ==========================================
[experimental]
  allowed_public_ports = []
  auto_rollback = true
