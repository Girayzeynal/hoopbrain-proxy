# ============================================================
# 🔥 HoopBrain Proxy — Fly.io FULL BUILD
# ============================================================

app = "hoopbrain-proxy"
primary_region = "ams"

kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  PYTHONUNBUFFERED = "1"
  PYTHONDONTWRITEBYTECODE = "1"
  # Buraya istersen API_KEY, SECRET_KEY vs ekleyebiliriz.
  # Faz-13 & Faz-23 sorguları buradan proxy'ye taşınacak.

[[services]]
  internal_port = 8080
  processes = ["app"]

  protocol = "tcp"

  [services.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.http_checks]
    interval = "6s"
    timeout = "3s"
    method = "get"
    path = "/health"
    protocol = "http"
    restart_limit = 5 
