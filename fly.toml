app = "hoopbrain-proxy"
primary_region = "ams"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = false
  min_machines_running = 1
  processes = ["app"]

  [http_service.checks]
    [http_service.checks.http]
      path = "/"
      interval = "10s"
      timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb" 
