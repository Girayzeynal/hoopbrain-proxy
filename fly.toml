app = "hoopbrain-proxy"
primary_region = "ams"

kill_signal = "SIGINT"
kill_timeout = "5s"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = false
  min_machines_running = 1
  max_machines_running = 1
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

[deploy]
  strategy = "immediate"

[experimental]
  allowed_public_ports = []
  auto_rollback = true

[checks]
  [checks.ping]
    port = 8080
    type = "tcp"
    interval = "10s"
    timeout = "3s"
