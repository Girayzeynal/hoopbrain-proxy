# ====================================================================
# 💠 HoopBrain Proxy – F14 Production Config (Final Stable Version)
# ====================================================================

app = "hoopbrain-proxy"
primary_region = "ams"

kill_signal = "SIGTERM"
kill_timeout = "5s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PRIMARY_REGION = "ams"
  PORT = "8080"
  FLY_PROCESS_GROUP = "app"

[[services]]
  internal_port = 8080
  protocol = "tcp"

  auto_start_machines = true
  auto_stop_machines = false      # ❗ Makine ASLA kendi kendine durmaz
  min_machines_running = 1        # ❗ Tek makine garanti açık
  max_machines_running = 1

  [services.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  # ---- TCP CHECK (Fly default) ----
  [[services.tcp_checks]]
    interval = "15s"
    timeout  = "3s"
    grace_period = "10s"
    restart_limit = 2

  # ---- HTTP CHECK (/ping endpoint'in) ----
  [[services.http_checks]]
    path = "/ping"
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    restart_limit = "2"
