app = "hoopbrain-proxy"
primary_region = "iad"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 1
processes = ["app"]

[[vm]]
memory = "1024mb"
cpu_kind = "shared"
cpus = 1

[env]
NODE_ENV = "production"
PORT = "8080"
