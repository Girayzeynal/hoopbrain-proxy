app = "hoopbrain-proxy"
primary_region = "ams"

kill_signal = "SIGINT"
kill_timeout = "5s"

[deploy]
  strategy = "immediate"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[[services]]
  internal_port = 8080
  force_https = true
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
