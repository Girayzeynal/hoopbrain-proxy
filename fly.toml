app = "hoopbrain-proxy"
primary_region = "ams"

# IAD gibi başka bölgelere makine açılmasını tamamen engeller
force_region = true

kill_signal = "SIGINT"
kill_timeout = "5s"

[env]
NODE_ENV = "production"
PORT = "8080"

# ==========================================
# HTTP SERVICE (LOAD BALANCER)
# ==========================================
[http_service]
internal_port = 8080
force_https = true
auto_start_machines = true
auto_stop_machines = true
min_machines_running = 1
max_machines_running = 2
processes = ["app"]

# ==========================================
# MACHINE TYPE
# ==========================================
[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "512mb"

# ==========================================
# SERVICES (MAKİNA MODELINE UYUMLU FORMAT)
# ==========================================
[[services]]
protocol = "tcp"
internal_port = 8080

  [[services.ports]]
  port = 80

  [[services.ports]]
  port = 443

  [[services.concurrency]]
  type = "requests"
  soft_limit = 60
  hard_limit = 120

# ==========================================
# DEPLOY STRATEGY
# ==========================================
[deploy]
strategy = "rolling"

# ==========================================
# EXPERIMENTAL
# ==========================================
[experimental]
allowed_public_ports = []
auto_rollback = true
