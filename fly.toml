app = "hoopbrain-proxy"
primary_region = "ams"

kill_signal = "SIGINT"
kill_timeout = 5

[build]
  dockerfile = "Dockerfile"

[env]
  PYTHONUNBUFFERED = "1"
  PORT = "8080"

[[services]]
  protocol = "tcp"
  internal_port = 8080
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    soft_limit = 50
    hard_limit = 100

  # 🔥 UYGULAMANIN KAPANMAMASI İÇİN HEALTHCHECK
  [services.http_checks]
    interval = "10s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/ping"
    protocol = "http"
    tls_skip_verify = false

# 🔥 AUTO-STOP’U %100 KAPATAN BÖLÜM
[checks]
  [checks.alive]
    type = "http"
    interval = "10s"
    timeout = "2s"
    method = "GET"
    path = "/ping"
    grace_period = "5s"
    port = 8080
