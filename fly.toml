app = "hoopbrain-proxy"
primary_region = "ams"
kill_signal = "SIGINT"
kill_timeout = "5s"

[deploy]
  strategy = "immediate"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[experimental]
  auto_rollback = true

[http_service]
  internal_port = 8080
  force_https = true

  # Auto-scaling
  auto_start_machines = true
  auto_stop_machines = true    # boşta olanlar uykuya
  min_machines_running = 1     # 1 tanesi 7/24
  max_machines_running = 2     # yükte ikinci açılır

  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb" 
