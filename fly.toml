app = "hoopbrain-proxy"
primary_region = "ams"

force_region = true

kill_signal = "SIGINT"
kill_timeout = "5s"

[env]
NODE_ENV = "production"
PORT = "8080"

[http_service]
internal_port = 8080
force_https = true
auto_start_machines = true
auto_stop_machines = true
min_machines_running = 1
max_machines_running = 2
processes = ["app"]

[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "512mb"

[[services]]
internal_port = 8080
protocol = "tcp"

  [[services.ports]]
  port = 80

  [[services.ports]]
  port = 443

  [[services.concurrency]]
  type = "requests"
  soft_limit = 60
  hard_limit = 120

[deploy]
strategy = "rolling"

[experimental]
allowed_public_ports = []
auto_rollback = true
